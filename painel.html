<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vellox — Painel</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; padding: 16px; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    header h1 { font-size: 20px; font-weight: 700; color: #1a1a1a; }
    header span { font-size: 12px; color: #999; }

    .entrega-form {
      display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap;
    }
    .entrega-form input {
      flex: 1; min-width: 200px; padding: 8px 12px;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 14px; outline: none;
    }
    .entrega-form input:focus { border-color: #e84545; }
    .entrega-form button {
      padding: 8px 18px; background: #e84545; color: white;
      border: none; border-radius: 8px; font-size: 14px;
      cursor: pointer; font-weight: 600;
    }
    .entrega-form button:hover { background: #c73535; }
    .entrega-form button:disabled { background: #ccc; cursor: not-allowed; }

    #geocode-status { font-size: 12px; color: #888; margin-bottom: 10px; min-height: 18px; }

    #map {
      width: 100%; height: calc(100vh - 260px);
      min-height: 350px; border-radius: 12px;
      border: 1px solid #ddd; overflow: hidden;
      background: #e8e8e8; margin-bottom: 14px;
    }

    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
    @media (max-width: 600px) { .cards { grid-template-columns: repeat(2, 1fr); } }
    .card { background: white; border-radius: 8px; padding: 10px 14px; border: 1px solid #eee; }
    .card-label { font-size: 11px; color: #999; margin-bottom: 4px; }
    .card-value { font-size: 15px; font-weight: 600; color: #1a1a1a; word-break: break-word; }

    #status-bar {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; padding: 8px 14px; border-radius: 8px;
      background: #f0f0f0; border: 1px solid #ddd; color: #666;
    }
    #status-bar.ativo     { background: #e6f9f0; border-color: #5dca8a; color: #1a7a46; }
    #status-bar.aguardando{ background: #fff8e6; border-color: #f5c842; color: #7a5c00; }
    #status-bar.offline   { background: #f0f0f0; border-color: #ccc;    color: #888; }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
  </style>
</head>
<body>

  <header>
    <h1>🗺️ Vellox — Painel</h1>
    <span id="last-update">Sem dados ainda</span>
  </header>

  <div class="entrega-form">
    <input type="text" id="endereco-input" placeholder="Digite o endereço de entrega — ex: Rua XV de Novembro, 1000, Curitiba" />
    <button id="btn-definir" onclick="definirDestino()">Definir destino</button>
  </div>
  <div id="geocode-status"></div>

  <div id="map"></div>

  <div class="cards">
    <div class="card">
      <div class="card-label">motoboy</div>
      <div class="card-value" id="coords-motoboy">—</div>
    </div>
    <div class="card">
      <div class="card-label">precisão GPS</div>
      <div class="card-value" id="acc">—</div>
    </div>
    <div class="card">
      <div class="card-label">destino</div>
      <div class="card-value" id="destino-display">Não definido</div>
    </div>
    <div class="card">
      <div class="card-label">atualizações</div>
      <div class="card-value" id="updates">0</div>
    </div>
  </div>

  <div id="status-bar" class="aguardando">
    <div class="dot"></div>
    <span id="status-text">Aguardando posição do motoboy...</span>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC9TEivEbj_fbpCSmdAWdxRxF3zFyHsN7o",
      authDomain: "vellox-gps.firebaseapp.com",
      databaseURL: "https://vellox-gps-default-rtdb.firebaseio.com",
      projectId: "vellox-gps",
      storageBucket: "vellox-gps.firebasestorage.app",
      messagingSenderId: "628189494210",
      appId: "1:628189494210:web:de677c675deb8ef8e7745b"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const MOTOBOY_ID = "motoboy_01";

    let map, markerMotoboy, markerDestino;
    let updates = 0;
    let mapInitialized = false;
    let lastUpdatedAt = null;

    // ícone motoboy — pino vermelho pulsante
    const iconMotoboy = () => L.divIcon({
      html: `<div style="width:20px;height:20px;border-radius:50%;background:#e84545;border:3px solid white;box-shadow:0 0 0 2px #e84545;animation:pulse 1.5s infinite;"></div>
      <style>@keyframes pulse{0%{box-shadow:0 0 0 2px #e84545}50%{box-shadow:0 0 0 8px rgba(232,69,69,0.2)}100%{box-shadow:0 0 0 2px #e84545}}</style>`,
      iconSize: [20, 20], iconAnchor: [10, 10], className: ''
    });

    // ícone destino — pino azul
    const iconDestino = () => L.divIcon({
      html: `<div style="width:20px;height:20px;border-radius:50% 50% 50% 0;background:#2563eb;border:3px solid white;box-shadow:0 0 0 2px #2563eb;transform:rotate(-45deg);"></div>`,
      iconSize: [20, 20], iconAnchor: [10, 20], className: ''
    });

    function initMap(lat, lng) {
      map = L.map('map').setView([lat, lng], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap', maxZoom: 19
      }).addTo(map);
      markerMotoboy = L.marker([lat, lng], { icon: iconMotoboy() }).addTo(map);
      mapInitialized = true;
    }

    function formatTime(ts) {
      return new Date(ts).toLocaleTimeString('pt-BR');
    }

    // verifica presença a cada 5 segundos
    setInterval(() => {
      if (!lastUpdatedAt) return;
      const segundos = Math.round((Date.now() - lastUpdatedAt) / 1000);
      if (segundos > 30) {
        const bar = document.getElementById('status-bar');
        bar.className = 'offline';
        document.getElementById('status-text').innerText =
          '⚫ Motoboy offline — último sinal há ' + segundos + 's';
      }
    }, 5000);

    // escuta posição do motoboy
    onValue(ref(db, 'motoboys/' + MOTOBOY_ID), (snapshot) => {
      const data = snapshot.val();
      if (!data) return;
      const { lat, lng, acc, updated_at } = data;

      if (!mapInitialized) {
        initMap(lat, lng);
      } else {
        markerMotoboy.setLatLng([lat, lng]);
        map.panTo([lat, lng]);
      }

      updates++;
      lastUpdatedAt = updated_at;
      document.getElementById('coords-motoboy').innerText = lat.toFixed(5) + ', ' + lng.toFixed(5);
      document.getElementById('acc').innerText = acc + ' m';
      document.getElementById('updates').innerText = updates;
      document.getElementById('last-update').innerText = 'Última atualização: ' + formatTime(updated_at);

      const bar = document.getElementById('status-bar');
      bar.className = 'ativo';
      document.getElementById('status-text').innerText = '🏍️ Motoboy online — posição recebida às ' + formatTime(updated_at);
    });

    // geocoding via Nominatim
    window.definirDestino = async function() {
      const endereco = document.getElementById('endereco-input').value.trim();
      if (!endereco) return;

      const btn = document.getElementById('btn-definir');
      const status = document.getElementById('geocode-status');
      btn.disabled = true;
      status.innerText = '🔍 Buscando endereço...';

      try {
        const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&q=' + encodeURIComponent(endereco);
        const res = await fetch(url, { headers: { 'Accept-Language': 'pt-BR' } });
        const data = await res.json();

        if (!data || data.length === 0) {
          status.innerText = '❌ Endereço não encontrado. Tente ser mais específico.';
          btn.disabled = false;
          return;
        }

        const lat = parseFloat(data[0].lat);
        const lng = parseFloat(data[0].lon);
        const nome = data[0].display_name;

        // coloca ou move marcador de destino
        if (markerDestino) {
          markerDestino.setLatLng([lat, lng]);
        } else {
          markerDestino = L.marker([lat, lng], { icon: iconDestino() })
            .addTo(map)
            .bindPopup('📦 Destino: ' + nome);
        }
        markerDestino.openPopup();

        // ajusta mapa para mostrar motoboy e destino
        if (markerMotoboy) {
          const bounds = L.latLngBounds(
            markerMotoboy.getLatLng(),
            [lat, lng]
          );
          map.fitBounds(bounds, { padding: [40, 40] });
        } else {
          map.setView([lat, lng], 15);
        }

        // salva destino no Firebase para o motoboy receber
        set(ref(db, 'entregas/' + MOTOBOY_ID), {
          destino_lat: lat,
          destino_lng: lng,
          destino_endereco: nome,
          status: 'em_rota',
          criado_em: Date.now()
        });

        document.getElementById('destino-display').innerText = endereco;
        status.innerText = '✅ Destino definido — motoboy notificado.';

      } catch (err) {
        status.innerText = '❌ Erro ao buscar endereço: ' + err.message;
      }

      btn.disabled = false;
    };

    // permite pressionar Enter no campo
    document.getElementById('endereco-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') window.definirDestino();
    });
  </script>

</body>
</html>
