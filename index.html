<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Vellox</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f5f5f5; padding: 12px; }
    h1 { font-size: 18px; font-weight: 600; color: #1a1a1a; margin-bottom: 12px; }

    #badge {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; padding: 4px 12px; border-radius: 8px;
      background: #f0f0f0; border: 1px solid #ddd; color: #666;
      margin-bottom: 8px;
    }
    #badge.ativo { background: #e6f9f0; border-color: #5dca8a; color: #1a7a46; }
    #badge.erro  { background: #fdecea; border-color: #e87070; color: #a32d2d; }

    #coords { font-size: 12px; color: #888; font-family: monospace; margin-bottom: 10px; display: block; }

    #map {
      width: 100%; height: calc(100vh - 220px);
      min-height: 300px; border-radius: 12px;
      border: 1px solid #ddd; overflow: hidden;
      background: #e8e8e8; margin-bottom: 12px;
    }

    .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
    .card { background: white; border-radius: 8px; padding: 10px 12px; border: 1px solid #eee; }
    .card-label { font-size: 11px; color: #999; margin-bottom: 4px; }
    .card-value { font-size: 17px; font-weight: 600; color: #1a1a1a; }

    .info { font-size: 11px; color: #aaa; }
  </style>
</head>
<body>

  <h1>GPS Vellox</h1>

  <span id="badge">📍 Aguardando GPS...</span>
  <span id="coords"></span>

  <div id="map"></div>

  <div class="cards">
    <div class="card">
      <div class="card-label">precisão</div>
      <div class="card-value" id="acc">—</div>
    </div>
    <div class="card">
      <div class="card-label">atualizações</div>
      <div class="card-value" id="updates">0</div>
    </div>
    <div class="card">
      <div class="card-label">distância total</div>
      <div class="card-value" id="dist">0 m</div>
    </div>
  </div>

  <p class="info">ℹ️ Permita o acesso à localização quando solicitado. Atualiza a cada 10m percorridos.</p>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, marker, polyline;
    let updates = 0;
    let totalDist = 0;
    let lastPos = null;
    let trail = [];

    function initMap(lat, lng) {
      map = L.map('map').setView([lat, lng], 17);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap',
        maxZoom: 19
      }).addTo(map);

      const icon = L.divIcon({
        html: '<div style="width:16px;height:16px;border-radius:50%;background:#e84545;border:3px solid white;box-shadow:0 0 0 2px #e84545;"></div>',
        iconSize: [16, 16],
        iconAnchor: [8, 8],
        className: ''
      });

      marker = L.marker([lat, lng], { icon }).addTo(map);
      polyline = L.polyline([], { color: '#e84545', weight: 3, opacity: 0.7 }).addTo(map);
    }

    function haversine(a, b) {
      const R = 6371000;
      const dLat = (b.lat - a.lat) * Math.PI / 180;
      const dLng = (b.lng - a.lng) * Math.PI / 180;
      const x = Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(a.lat * Math.PI/180) * Math.cos(b.lat * Math.PI/180) *
        Math.sin(dLng/2) * Math.sin(dLng/2);
      return R * 2 * Math.atan2(Math.sqrt(x), Math.sqrt(1 - x));
    }

    function onPosition(pos) {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = pos.coords.accuracy;

      if (!map) initMap(lat, lng);

      marker.setLatLng([lat, lng]);
      map.panTo([lat, lng]);

      trail.push([lat, lng]);
      polyline.setLatLngs(trail);

      updates++;
      document.getElementById('updates').innerText = updates;
      document.getElementById('acc').innerText = Math.round(acc) + ' m';
      document.getElementById('coords').innerText = lat.toFixed(6) + ', ' + lng.toFixed(6);

      if (lastPos) {
        totalDist += haversine(lastPos, { lat, lng });
        document.getElementById('dist').innerText = totalDist < 1000
          ? Math.round(totalDist) + ' m'
          : (totalDist / 1000).toFixed(2) + ' km';
      }
      lastPos = { lat, lng };

      const badge = document.getElementById('badge');
      badge.innerText = '✅ GPS ativo';
      badge.className = 'ativo';
    }

    function onError(err) {
      const badge = document.getElementById('badge');
      badge.innerText = '❌ ' + err.message;
      badge.className = 'erro';

      if (!map) {
        initMap(-25.4284, -49.2733);
        document.getElementById('coords').innerText = 'demo — Curitiba, PR';
      }
    }

    if (navigator.geolocation) {
      navigator.geolocation.watchPosition(onPosition, onError, {
        enableHighAccuracy: true,
        distanceFilter: 10
      });
    } else {
      onError({ message: 'Geolocation não suportado neste browser' });
    }
  </script>

</body>
</html>
